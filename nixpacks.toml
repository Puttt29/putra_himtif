# Konfigurasi Railway Nixpacks untuk Laravel PHP murni
[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer']

[phases.install]
cmds = ['composer install --no-dev --optimize-autoloader --no-interaction']

[phases.build]
cmds = ['php artisan config:clear']

[start]
cmd = 'php artisan migrate --seed --force && php artisan serve --host=0.0.0.0 --port=$PORT'

